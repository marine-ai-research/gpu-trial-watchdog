name: Offline source validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == vars.CONTROLLER_REPOSITORY && github.sha == vars.REVIEWED_CONTROLLER_COMMIT
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Offline tests; no credentials or API calls
        run: python3 -I -B -m unittest discover -p 'test*.py' -v
